services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asterisk
      POSTGRES_PASSWORD: asterisk
      POSTGRES_DB: asterisk
    ports:
      # Only host-side code needs this (AsteriskBroker's direct SQL insert for the "endpoint"
      # PJSIP object, see AsteriskOptions.DatabaseConnectionString) — Asterisk itself reaches
      # postgres over the compose-internal network regardless, same as asterisk's ARI/AMI ports
      # already being published for the same reason. Host port 5433, not 5432 — confirmed via a
      # live auth failure that a native Postgres install can already be running on the standard
      # port on a dev machine, silently intercepting connections meant for this container.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterisk"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./migrate
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      # Mounted, not baked into the image, so editing the seed file doesn't need a
      # rebuild — see docker/migrate/apply_seed.py.
      - ./asterisk/seed-test-endpoint.sql:/seed/seed-test-endpoint.sql:ro

  asterisk:
    build:
      context: ./asterisk
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5060:5060/udp"   # SIP UDP (server-to-server/PSTN trunking, and Ringly.Samples.Maui's default local-dev transport)
      - "8088:8088/tcp"   # ARI/HTTP (internal-only in real deployments; exposed here for local dev)
      - "8089:8089/tcp"   # WSS (WebRTC/mobile SIP signaling + ARI events)
      - "5038:5038/tcp"   # AMI (internal-only in real deployments; exposed here for local dev)
      - "10000-10099:10000-10099/udp"  # RTP media
    restart: unless-stopped

  coturn:
    build:
      context: ./coturn
      dockerfile: Dockerfile
    ports:
      - "3478:3478/tcp"   # STUN/TURN
      - "3478:3478/udp"   # STUN/TURN
      - "5349:5349/tcp"   # STUN/TURN over TLS (TURNS)
      - "5349:5349/udp"   # STUN/TURN over TLS (TURNS)
      - "49160-49200:49160-49200/udp"  # TURN relay media range
    restart: unless-stopped

  # Tunnels Asterisk's SIP UDP port to the public internet via playit.gg — for testing
  # samples/Ringly.Samples.Maui from a real device that isn't on the same LAN as this
  # machine (an emulator reaches the host directly via 10.0.2.2; a genuinely remote device
  # can't). Chosen over ngrok specifically because ngrok has no UDP support at any tier,
  # and this Asterisk image's pjproject build has no TCP transport compiled in either
  # (confirmed via a live "pjsip show transports" test) — the two are incompatible with
  # each other, whereas playit.gg tunnels UDP directly, matching the transport this stack
  # already uses. Gated behind the "tunnel" profile (opt-in via
  # `docker compose --profile tunnel up -d`) since it dials out to a third-party relay
  # network — not something to start by default.
  #
  # Setup (one-time, needs your own playit.gg account — this part can't be automated):
  #   1. Sign up / log in at https://playit.gg and claim an agent from the dashboard.
  #   2. Copy its secret key into a ".env" file next to this compose file:
  #      PLAYIT_SECRET_KEY=<your key>
  #   3. `docker compose --profile tunnel up -d playit`, then in the playit.gg dashboard
  #      add a UDP tunnel for this agent pointing at local address "asterisk:5060" (the
  #      `playit` container shares this file's default Compose network with the `asterisk`
  #      service, so the container name resolves).
  #   4. The dashboard shows the public host:port playit assigns — point a remote MAUI
  #      instance's RegistrarHost at that instead of "10.0.2.2"/your LAN IP.
  # Full two-way audio from a genuinely remote device additionally depends on coturn's
  # relay (3478/udp + the 49160-49200 range above) being reachable, which needs its own
  # tunnel/port-forward if you're testing from off-network — not set up here, since the
  # signaling path (register + call routing) is the part this was built to prove.
  #
  # playit.gg's own dashboard-generated run command uses `--net=host`, which works on native
  # Linux but was confirmed NOT to reach other containers' published ports under Docker
  # Desktop on Windows (its "host" networking shares the internal VM's namespace, not the
  # same one the "ports:" published-port proxy binds — verified live: a probe sent from
  # inside a `network_mode: host` container to "localhost:5060" never reached Asterisk, even
  # though both a listening socket on port 5060 was visible in /proc/net/udp from that
  # namespace and Asterisk's own container confirmed it was listening). Using the regular
  # Compose bridge network with the "asterisk" service name instead sidesteps that platform
  # quirk entirely and is portable across OSes.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    profiles: ["tunnel"]
    environment:
      # Compose interpolates every service's environment at parse time regardless of which
      # profiles are active, so this can't use required ("${VAR:?err}") syntax without
      # breaking `docker compose up -d` for everyone who hasn't set this — even though they
      # never asked for the "tunnel" profile. Falls back to empty; the playit container itself
      # exits with a clear error if it starts without a real key.
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}
    depends_on:
      - asterisk
    restart: unless-stopped

  # Row #38c — Dograh (self-hosted, ghcr.io/dograh-hq), vendored here so anyone cloning this
  # repo gets a working instance rather than a personal machine-specific one. Gated behind the
  # "dograh" profile (opt-in via `docker compose --profile dograh up -d`) — the AI agent path is
  # a stretch feature per §11.5, not part of the base stack. Every service here joins the same
  # default Compose network as `asterisk`, so container-name resolution (`asterisk`, `dograh-api`)
  # works both directions without any extra network wiring.
  #
  # Dev-only secrets below, same "replace before any non-local deployment" convention as the rest
  # of this file. If you already run a separate Dograh instance elsewhere, stop it first — this
  # profile publishes the same default host ports (8000 API / 3010 UI).
  dograh-postgres:
    image: pgvector/pgvector:pg17
    profiles: ["dograh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dograh-dev-postgres
      POSTGRES_DB: postgres
    volumes:
      - dograh_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  dograh-redis:
    image: redis:7
    profiles: ["dograh"]
    command: ["--requirepass", "dograh-dev-redis"]
    volumes:
      - dograh_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dograh-dev-redis", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  dograh-minio:
    image: minio/minio
    profiles: ["dograh"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dograh-dev-minio
      MINIO_ROOT_PASSWORD: dograh-dev-minio-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - dograh_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  dograh-api:
    image: ghcr.io/dograh-hq/dograh-api:latest
    profiles: ["dograh"]
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://postgres:dograh-dev-postgres@dograh-postgres:5432/postgres
      REDIS_URL: redis://:dograh-dev-redis@dograh-redis:6379
      MINIO_ENDPOINT: dograh-minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: dograh-dev-minio
      MINIO_SECRET_KEY: dograh-dev-minio-secret
      MINIO_BUCKET: voice-audio
      MINIO_SECURE: "false"
      ENABLE_AWS_S3: "false"
      FASTAPI_WORKERS: "1"
      # Trust nginx/host-forwarded headers — no reverse proxy in local dev, but this keeps
      # webhook signature checks from silently failing if one is added later (see Dograh's own
      # compose file comment on this exact setting).
      FORWARDED_ALLOW_IPS: "*"
      ENABLE_TELEMETRY: "false"
      # Dev-only — replace before any non-local deployment.
      OSS_JWT_SECRET: dograh-dev-oss-jwt-secret-change-me
    ports:
      - "8000:8000"
    depends_on:
      dograh-postgres:
        condition: service_healthy
      dograh-redis:
        condition: service_healthy
      dograh-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  dograh-ui:
    image: ghcr.io/dograh-hq/dograh-ui:latest
    profiles: ["dograh"]
    environment:
      HOSTNAME: "0.0.0.0"
      BACKEND_URL: http://dograh-api:8000
      NODE_ENV: oss
      ENABLE_TELEMETRY: "false"
    ports:
      - "3010:3010"
    depends_on:
      dograh-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  dograh_postgres_data:
  dograh_redis_data:
  dograh_minio_data:
