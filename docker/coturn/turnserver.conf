# §6 item 6 — coturn STUN/TURN server, reachable from client ICE config.
#
# Star topology per §1: a client only needs to reach coturn/Asterisk (known
# public servers), not other clients — so this covers the client→Asterisk
# NAT-traversal hop, not full P2P TURN relay.

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Without this, coturn advertises its own container-internal Docker bridge IP
# (172.22.0.x) as the address for relayed ICE candidates — reachable from the Windows
# host (Docker Desktop routes host<->container directly) but NOT from an Android
# emulator, which only has a route to the host's real interfaces, not Docker's
# internal bridge network. Confirmed live: relay candidates advertised as
# "172.22.0.4:PORT" made ICE connectivity checks from the emulator fail outright
# ("ICE RTP channel disconnected"/"failed"), while RTP encoding on the Android side
# succeeded but every packet was dropped with "SendRtpPacket cannot be called on a
# secure session before calling SetSecurityContext" since DTLS-SRTP never completed
# over the unreachable relay path. Setting this to the host machine's actual LAN IP
# (found via `Get-NetIPAddress`/`ipconfig` — this will need updating if that address
# changes, e.g. a different Wi-Fi network) makes relay candidates usable from both the
# Windows app (same machine) and a real device/emulator on the same network, since
# it's a genuinely routable address rather than Docker-internal-only.
external-ip=192.168.1.92

# Long-term credential mechanism (RFC 5766) — dev-only user, replace before
# any non-local deployment, same convention as the Asterisk ARI/AMI users.
realm=ringly.local
lt-cred-mech
user=ringly:ringly-dev-turn

fingerprint
no-cli
no-multicast-peers

cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

log-file=stdout
