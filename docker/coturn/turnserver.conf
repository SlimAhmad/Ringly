# §6 item 6 — coturn STUN/TURN server, reachable from client ICE config.
#
# Star topology per §1: a client only needs to reach coturn/Asterisk (known
# public servers), not other clients — so this covers the client→Asterisk
# NAT-traversal hop, not full P2P TURN relay.

listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Long-term credential mechanism (RFC 5766) — dev-only user, replace before
# any non-local deployment, same convention as the Asterisk ARI/AMI users.
realm=ringly.local
lt-cred-mech
user=ringly:ringly-dev-turn

fingerprint
no-cli
no-multicast-peers

cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem

log-file=stdout
