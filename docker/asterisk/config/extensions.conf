;
; §6 item 3 / §8.5 — minimal Stasis handoff contexts. Every dialed extension
; (client, or a PSTN-shaped number once trunking exists) is handed to the ARI
; app; the app decides routing/trunk selection, not the static dialplan.
;

[ride_hailing]
; Confirmed live as a real bug: extension 1002's own context=dograh_ai (set in the [dograh_ai]
; context below) only governs dialplan routing for calls 1002 itself ORIGINATES — it has no
; effect on calls placed TO "1002" by someone else. A customer dialing "1002" uses THEIR OWN
; endpoint's context (ride_hailing) to route the call, which — without this literal-extension
; entry — fell through to the generic _X. pattern below instead, handing it to
; RideHailingCallRouter, which then tried to dial PJSIP/1002 directly (no registered contact,
; rings forever) instead of ever reaching Stasis(dograh,...). A literal extension match takes
; priority over the _X. pattern regardless of file order (Asterisk's own pattern-specificity
; rule) — this is what actually lets a ride_hailing-context customer reach Dograh by dialing
; 1002, matching row #38c's Dograh extension below.
exten => 1002,1,NoOp(Routing 1002 to Dograh)
 same => n,Stasis(dograh,1002)
; No Hangup() after Stasis() here (unlike the _X. pattern below) - confirmed live as the actual
; cause of a call being hung up ~36ms after EscalateToQueueAsync's ARI /channels/{id}/move call
; moved it into Ringly's own app: moving a channel to a different Stasis app makes THIS dialplan
; thread's own Stasis(dograh,1002) call return (the channel is no longer under ITS control), which
; then fell straight into Hangup() - racing against, and beating, this exact channel already being
; successfully bridged into the queue's holding bridge by the new app. Falling off the end of the
; extension with no more priorities does NOT hang up a channel that's already bridged/Stasis-owned
; elsewhere, so leaving nothing here is the fix, not a replacement action.

; Dograh's native "Call Transfer" tool (docs.dograh.com/voice-agent/tools/call-transfer) needs a
; real destination string to dial — used instead of the raw ARI /channels/{id}/move approach
; (EscalateToQueueAsync), which turned out to make Dograh's own app hang the call up defensively
; the instant it noticed the channel disappear from its Stasis app. The destination
; SupportController's PostDograhTransferResolverAsync hands back is "Local/9000@ride_hailing" —
; confirmed live via `channel originate Local/9000@ride_hailing ...` that this reaches this exact
; extension correctly. A static PJSIP endpoint pointing at a Local channel was tried first and
; confirmed NOT to work: res_pjsip's own AOR contact field only accepts genuine sip(s): URIs
; ("Contact uri or hostname length exceeds pjproject limit or is not a sip(s) uri"), so no PJSIP
; config exists for "9000" at all — Local/9000@ride_hailing is a valid Asterisk dial string on its
; own, needing no endpoint/AOR. This is a genuinely fresh channel Dograh dials itself, not one
; being moved mid-flight, so none of the /move race applies. RideHailingCallRouter special-cases
; extension "9000" to answer it and bridge it straight into the support queue's holding bridge
; instead of trying to dial "9000" as if it were a real callee extension. NOTE: unconfirmed
; whether Dograh's own tool validation accepts a "Local/..." destination string at all — its docs
; only give PJSIP/SIP examples ("Asterisk ARI transfers only work with SIP endpoints configured on
; your Asterisk server") - needs a live test against Dograh itself.
exten => 9000,1,NoOp(Routing Dograh call-transfer target into the support queue)
 same => n,Stasis(ride_hailing_app,9000)

[call_center]
; Same literal-extension-intercept reasoning as [ride_hailing] above, including the missing
; Hangup() - see that context's own comment for why.
exten => 1002,1,NoOp(Routing 1002 to Dograh)
 same => n,Stasis(dograh,1002)

exten => _X.,1,NoOp(Routing ${EXTEN} into ARI app)
 same => n,Stasis(call_center_app,${EXTEN})
 same => n,Hangup()

; §5.3 / row #22 — StasisBroadcast() claim-race smoke-test context. Broadcasts to every
; currently-connected ARI application; first to POST /ari/events/claim wins (204), the
; rest get 409. 5s timeout gives concurrent acceptance-test claims room to race.
[broadcast_test]
exten => _X.,1,NoOp(Broadcasting ${EXTEN} to all connected ARI apps)
 same => n,StasisBroadcast(5000)
 same => n,Hangup()

; Row #38c — Dograh's own Stasis app (registered as the `dograh` ARI user), not Ringly's.
; Confirmed live: this context is only ever entered by a call something ORIGINATES FROM one of
; its own extensions — since the Dograh-answered extensions here never originate calls
; themselves, this context in practice sees no traffic. The real routing for "a customer dials
; 1002 to reach Dograh" lives in [ride_hailing]/[call_center] above instead (literal-extension
; intercepts before their own _X. pattern), since Asterisk resolves dialplan context from the
; CALLING party's own endpoint, not the dialed digits. Kept here as a home for any extension
; that might someday genuinely originate its own calls into Dograh, and to keep the `dograh`
; ARI app's own Stasis(dograh,...) invocation defined in one place both intercepts reference.
[dograh_ai]
exten => _X.,1,NoOp(Routing ${EXTEN} to Dograh)
 same => n,Stasis(dograh,${EXTEN})
; No Hangup() here either - see [ride_hailing]'s own comment for why.
