;
; §6 item 3 / §8.5 — minimal Stasis handoff contexts. Every dialed extension
; (client, or a PSTN-shaped number once trunking exists) is handed to the ARI
; app; the app decides routing/trunk selection, not the static dialplan.
;

[ride_hailing]
; Confirmed live as a real bug: extension 1002's own context=dograh_ai (set in the [dograh_ai]
; context below) only governs dialplan routing for calls 1002 itself ORIGINATES — it has no
; effect on calls placed TO "1002" by someone else. A customer dialing "1002" uses THEIR OWN
; endpoint's context (ride_hailing) to route the call, which — without this literal-extension
; entry — fell through to the generic _X. pattern below instead, handing it to
; RideHailingCallRouter, which then tried to dial PJSIP/1002 directly (no registered contact,
; rings forever) instead of ever reaching Stasis(dograh,...). A literal extension match takes
; priority over the _X. pattern regardless of file order (Asterisk's own pattern-specificity
; rule) — this is what actually lets a ride_hailing-context customer reach Dograh by dialing
; 1002, matching row #38c's Dograh extension below.
exten => 1002,1,NoOp(Routing 1002 to Dograh)
 same => n,Stasis(dograh,1002)
 same => n,Hangup()

exten => _X.,1,NoOp(Routing ${EXTEN} into ARI app)
 same => n,Stasis(ride_hailing_app,${EXTEN})
 same => n,Hangup()

; Dograh's native "Call Transfer" tool (docs.dograh.com/voice-agent/tools/call-transfer) only
; accepts a SIP endpoint string as its transfer destination, not an arbitrary ARI operation —
; confirmed against Dograh support after the raw ARI /channels/{id}/move approach
; (EscalateToQueueAsync) turned out to make Dograh's own app hang the call up defensively the
; instant it noticed the channel disappear from its Stasis app. "9000" is a static, never-
; registering PJSIP endpoint (ps_aors.contact = Local/9000@ride_hailing, seeded directly into
; realtime Postgres — see docker/asterisk/seed-test-endpoint.sql) purely so dialing PJSIP/9000
; has somewhere real to land: Asterisk resolves that static contact to a Local channel, which
; runs this exact dialplan and reaches Stasis(ride_hailing_app,9000) like any other call — this
; is a genuinely fresh channel Dograh dials itself, not one being moved mid-flight, so none of
; the /move race applies. RideHailingCallRouter special-cases extension "9000" to answer it and
; bridge it straight into the support queue's holding bridge instead of trying to dial "9000" as
; if it were a real callee extension.
exten => 9000,1,NoOp(Routing Dograh call-transfer target into the support queue)
 same => n,Stasis(ride_hailing_app,9000)

[call_center]
; Same literal-extension-intercept reasoning as [ride_hailing] above.
exten => 1002,1,NoOp(Routing 1002 to Dograh)
 same => n,Stasis(dograh,1002)
 same => n,Hangup()

exten => _X.,1,NoOp(Routing ${EXTEN} into ARI app)
 same => n,Stasis(call_center_app,${EXTEN})
 same => n,Hangup()

; §5.3 / row #22 — StasisBroadcast() claim-race smoke-test context. Broadcasts to every
; currently-connected ARI application; first to POST /ari/events/claim wins (204), the
; rest get 409. 5s timeout gives concurrent acceptance-test claims room to race.
[broadcast_test]
exten => _X.,1,NoOp(Broadcasting ${EXTEN} to all connected ARI apps)
 same => n,StasisBroadcast(5000)
 same => n,Hangup()

; Row #38c — Dograh's own Stasis app (registered as the `dograh` ARI user), not Ringly's.
; Confirmed live: this context is only ever entered by a call something ORIGINATES FROM one of
; its own extensions — since the Dograh-answered extensions here never originate calls
; themselves, this context in practice sees no traffic. The real routing for "a customer dials
; 1002 to reach Dograh" lives in [ride_hailing]/[call_center] above instead (literal-extension
; intercepts before their own _X. pattern), since Asterisk resolves dialplan context from the
; CALLING party's own endpoint, not the dialed digits. Kept here as a home for any extension
; that might someday genuinely originate its own calls into Dograh, and to keep the `dograh`
; ARI app's own Stasis(dograh,...) invocation defined in one place both intercepts reference.
[dograh_ai]
exten => _X.,1,NoOp(Routing ${EXTEN} to Dograh)
 same => n,Stasis(dograh,${EXTEN})
 same => n,Hangup()
