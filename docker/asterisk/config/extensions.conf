;
; §6 item 3 / §8.5 — minimal Stasis handoff contexts. Every dialed extension
; (client, or a PSTN-shaped number once trunking exists) is handed to the ARI
; app; the app decides routing/trunk selection, not the static dialplan.
;

[ride_hailing]
exten => _X.,1,NoOp(Routing ${EXTEN} into ARI app)
 same => n,Stasis(ride_hailing_app,${EXTEN})
 same => n,Hangup()

[call_center]
exten => _X.,1,NoOp(Routing ${EXTEN} into ARI app)
 same => n,Stasis(call_center_app,${EXTEN})
 same => n,Hangup()

; §5.3 / row #22 — StasisBroadcast() claim-race smoke-test context. Broadcasts to every
; currently-connected ARI application; first to POST /ari/events/claim wins (204), the
; rest get 409. 5s timeout gives concurrent acceptance-test claims room to race.
[broadcast_test]
exten => _X.,1,NoOp(Broadcasting ${EXTEN} to all connected ARI apps)
 same => n,StasisBroadcast(5000)
 same => n,Hangup()

; Row #38c — extensions meant to be AI-first from the start go straight to Dograh's own
; Stasis app (registered as the `dograh` ARI user), not Ringly's. This is deliberately a
; separate context from ride_hailing/call_center above: Dograh and Ringly each own a disjoint
; set of extensions, and calls never move between the two apps mid-call — see the row #38b/#39
; notes in Ringly-Reference.md for why a handoff isn't possible or attempted. Assign whichever
; extension range you want AI-answered to this context (or point Dograh's own inbound workflow
; assignment at extensions already routed here); escalation to a human happens as a plain
; Dial()/transfer from within Dograh's own workflow into one of Ringly's queue extensions —
; an ordinary call from Dograh's perspective, needing no code on Ringly's side.
[dograh_ai]
exten => _X.,1,NoOp(Routing ${EXTEN} to Dograh)
 same => n,Stasis(dograh,${EXTEN})
 same => n,Hangup()
