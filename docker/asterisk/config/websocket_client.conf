;
; Row #38c — the external-media leg Dograh's own Asterisk ARI integration uses to stream a
; call's audio (chan_websocket/res_websocket_client, confirmed present and loaded in this
; Asterisk build — module names: chan_websocket.so, res_websocket_client.so,
; res_http_websocket.so, res_pjsip_transport_websocket.so). Config fields confirmed against
; Asterisk's own res_websocket_client documentation, not guessed.
;
; connection_type = per_call_config means this connection is a template, not a fixed target —
; Dograh's ARI app supplies the real per-call destination when it creates the externalMedia
; channel (POST /ari/channels/externalMedia, external_host referencing this connection's name).
; Dograh appends its own query string (?workflow_id=...&organization_id=...&workflow_run_id=...)
; onto whatever base URL is configured here, per Dograh's own docs
; (docs.dograh.com/integrations/telephony/asterisk-ari): "Configure the uri as a base URL only,
; without a query string." Confirmed live as a real bug: without the /api/v1/telephony/ws/ari
; path, Asterisk connected to ws://dograh-api:8000/?workflow_id=... (query string appended
; straight to the bare host, no path) — Dograh's websocket server rejected every such connection
; with 403 Forbidden, and the call was torn down after 5 failed attempts. The docs' own
; troubleshooting note ("opening /api/v1/telephony/ws/ari directly... can return 403 because
; routing parameters are missing") only covers manual testing without the query string; a real
; Asterisk connection missing the *path* hits the exact same 403 for a different reason.
; Container-name resolution works since dograh-api joins the same default Compose network as
; this container (see docker-compose.yml's "dograh" profile).
;
; Dograh's external media channel uses G.711 μ-law — any PJSIP endpoint/trunk that Dograh-routed
; calls pass through needs allow=ulaw. Endpoints here are provisioned dynamically via realtime
; Postgres (row #19b), not statically in pjsip.conf, so this isn't set here — set it at
; provisioning time for whichever extension you assign to the dograh_ai context (row #7's
; SipEndpointConfig deliberately left codec allow/disallow out until a row needed it — this is
; that row).
[dograh_media]
type = websocket_client
uri = ws://dograh-api:8000/api/v1/telephony/ws/ari
protocols = media
connection_type = per_call_config
connection_timeout = 500
reconnect_interval = 500
reconnect_attempts = 5
tls_enabled = no
