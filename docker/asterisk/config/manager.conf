;
; §6 item 5 — AMI user, scoped permissions (not "system"), optional/reporting
; only per §5.9. Bound to 0.0.0.0 so the docker-compose network and host
; port-forward can both reach it for local dev — restrict to private ranges
; here; tighten further (or bind to a specific internal address) for any
; non-local deployment.
;
[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
webenabled = no

[ringly]
secret = ringly-dev-ami
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
permit = 10.0.0.0/255.0.0.0
permit = 172.16.0.0/255.240.0.0
permit = 192.168.0.0/255.255.0.0
read = call,cdr,agent
write = call,cdr,agent
