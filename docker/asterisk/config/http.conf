; Built-in HTTP server — ARI and the SIP-over-WebSocket (WSS) transport both
; ride on this. Port 8088 (plain) is internal-only per §6 checklist item 7;
; 8089 (TLS) is what WebRTC/mobile clients connect to for SIP signaling.
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
tlsenable = yes
tlsbindaddr = 0.0.0.0:8089
tlscertfile = /etc/asterisk/keys/asterisk.crt
tlsprivatekey = /etc/asterisk/keys/asterisk.key
