;
; §6 item 4 — ARI HTTP API user + channelvars for StasisBroadcast skill-based
; routing (§5.3). Rides on the HTTP server enabled in http.conf.
;
[general]
enabled = yes
pretty = yes
allowed_origins = *
channelvars = CUSTOMERID,QUEUE_NAME

; Dev-only credentials — replace before any non-local deployment.
[ringly]
type = user
read_only = no
password = ringly-dev-ari
password_format = plain

; Row #38c — a second, independent ARI app user for Dograh's own Stasis application
; (`dograh_ai` context below routes to it). Dograh owns this connection end-to-end: it
; registers as this ARI user directly against Asterisk, same as `ringly` does — nothing in
; Ringly's own code talks to this app. Set the matching "Stasis App Name" / "App Password" in
; Dograh's own Asterisk ARI telephony configuration (its dashboard) to `dograh` / this password.
[dograh]
type = user
read_only = no
password = dograh-dev-ari
password_format = plain
