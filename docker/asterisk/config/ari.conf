;
; §6 item 4 — ARI HTTP API user + channelvars for StasisBroadcast skill-based
; routing (§5.3). Rides on the HTTP server enabled in http.conf.
;
[general]
enabled = yes
pretty = yes
allowed_origins = *
channelvars = CUSTOMERID,QUEUE_NAME

; Dev-only credentials — replace before any non-local deployment.
[ringly]
type = user
read_only = no
password = ringly-dev-ari
password_format = plain
