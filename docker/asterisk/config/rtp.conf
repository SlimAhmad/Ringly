; strictrtp defaults to "yes" in Asterisk, which locks onto the first source address/port a
; channel's RTP appears to come from and silently discards anything from a different one
; afterward — no log line, no counter increment, the packet just vanishes. This is
; fundamentally incompatible with ICE (used throughout this stack's webrtc=yes endpoints):
; ICE negotiates and can nominate a *different* candidate pair than whatever was first offered
; in the SDP, so legitimate media arriving via the actually-nominated path gets silently
; dropped by strict-RTP's stale expectation. Confirmed live: `rtp show settings` showed
; "Strict RTP: Yes", and `rtp set debug on` showed literally zero RTP packets reaching Asterisk
; during a call both endpoints' own logs reported as fully connected (ICE + DTLS-SRTP
; complete) — this setting is the explanation for the entire "connects fine, no audio ever
; flows" pattern.
[general]
strictrtp=no

; externaddr is the RTP/ICE engine's OWN NAT-traversal setting (res_rtp_asterisk), completely
; separate from pjsip.conf's external_media_address/external_signaling_address — confirmed live
; via a real SIP/SDP trace (`pjsip set logger on`) that without this, the SDP's session-level
; "c=" line correctly showed the external LAN IP (external_media_address doing its job at the
; SIP/SDP-rendering layer), but the ICE "a=candidate:...typ host" line still literally contained
; the raw Docker container-internal address (172.22.0.x) — pjsip.conf's setting only affects
; SIP-layer SDP rendering, not the ICE candidates the RTP engine itself generates.
;
; externaddr alone turned out NOT to be enough — confirmed live (via a fresh SDP trace after
; adding it) that the "typ host" candidate still showed the raw container address regardless.
; That's actually correct ICE behavior: a "host" candidate is BY DEFINITION the raw local
; interface address — ICE's whole design is to offer that AND a separate NAT-traversal candidate
; (server-reflexive, "typ srflx") and let connectivity checks pick whichever pair actually works.
;
; Tried and REVERTED: stunaddr=coturn:3478, pointing Asterisk's own ICE agent at coturn to gather
; a srflx candidate the same way clients use coturn. Made things actively worse — confirmed live
; via a fresh SDP trace: no srflx candidate ever appeared (still only "typ host" with the raw
; container address), calls took visibly longer to connect, and audio/video stopped working
; entirely (regression from the prior partially-working state). Root cause: coturn and Asterisk
; are both containers on the SAME Docker bridge network, so there's no real NAT between them for
; STUN to usefully characterize — STUN exists to answer "what does the outside world see as my
; address," which is a meaningless question for same-host container-to-container traffic. A fresh
; trace also showed an unexplained candidate address (10.104.150.211) matching no adapter on this
; machine, most likely a side effect of Docker Desktop's own internal WSL/Hyper-V NAT layer
; mangling the STUN round-trip — not a usable answer either way. STUN is the right protocol for a
; client on a real, separate network behind NAT; it isn't the right lever for Asterisk's own
; same-host container in a single-machine dev deployment. Left unresolved for now — the ICE "typ
; host" candidate genuinely can't be made to show the external LAN IP without either a real STUN
; server outside Docker's network, or an approach that doesn't rely on ICE for the
; Asterisk<->client leg (e.g. rewriting the connection to not require the container's own
; interface address to already be externally reachable).
;
; Deliberately NOT setting localnet here either, for the identical reason local_net was removed
; from pjsip.conf's [transport-udp] (see that file's comment): Docker Desktop's port-forwarding
; makes every external peer appear to originate from the Docker bridge gateway (172.22.0.1),
; which would fall inside any Docker-subnet localnet range and silently defeat externaddr the
; same way local_net defeated external_media_address.
;
; Kept in sync with docker/coturn/turnserver.conf's external-ip, pjsip.conf's
; external_media_address/external_signaling_address, and MauiProgram.cs's CurrentLanHostAddress by
; docker/update-network-ip.ps1 — see that script.
; ringly:lan-ip
externaddr=10.160.118.49
