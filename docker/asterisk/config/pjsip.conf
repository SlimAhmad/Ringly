;
; §6 item 2 — transport-wss (WebRTC/mobile clients) + transport-udp (server-to-server/PSTN trunking)
;

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0

; All other transport parameters are ignored for wss transports — TLS itself
; is handled by http.conf, since WSS rides on Asterisk's built-in HTTP server.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

;
; Single static smoke-test endpoint (extension 1000) so this deployment can be
; verified end-to-end locally without the realtime PJSIP backend (§6 item 8,
; needed for row #7's dynamic config PUT to persist, tracked separately).
; Mirrors the provisioning template row #7 builds dynamically: webrtc=yes and
; set_var=PJSIP_TRANSFER_HANDLING()=ari-only per §5.4/§5.8.
;
[1000]
type = aor
max_contacts = 1

[1000]
type = auth
auth_type = userpass
username = 1000
password = ringly-dev-1000

[1000]
type = endpoint
context = ride_hailing
disallow = all
allow = opus,ulaw
auth = 1000
aors = 1000
webrtc = yes
set_var = PJSIP_TRANSFER_HANDLING()=ari-only
