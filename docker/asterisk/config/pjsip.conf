;
; §6 item 2 — transport-wss (WebRTC/mobile clients) + transport-udp (server-to-server/PSTN trunking)
;
; Endpoint/auth/aor objects are sourced from realtime (Postgres) per
; sorcery.conf/§6 item 8 — see docker/asterisk/seed-test-endpoint.sql for the
; row #19 smoke-test endpoint (extension 1000), not defined here.
;

; external_media_address/external_signaling_address tell Asterisk to advertise the Docker HOST's
; real LAN IP in SDP/Contact headers instead of its own container-internal address (172.22.0.4,
; confirmed live via a real device's SDP trace) — the exact same class of fix as coturn's
; external-ip (docker/coturn/turnserver.conf), and just as easy to overlook since nothing fails
; loudly without it: SIP signaling and registration work fine regardless (this machine's Docker
; networking routes host<->container directly), but a real device on the LAN has no route into
; Docker's internal bridge network at all. Endpoints provisioned with webrtc=yes (see
; AsteriskBroker.Credentials.cs) get ice_support/media_encryption=dtls automatically, which means
; Asterisk terminates/relays media on each leg itself rather than doing classic direct-media
; passthrough — by design for a WebRTC gateway — so its OWN candidate address matters just as much
; as coturn's. local_net marks the Docker-internal subnet as "local" so Asterisk knows to
; substitute the external address only for genuinely external (LAN/internet) peers, not for
; container-to-container traffic. Kept in sync with docker/coturn/turnserver.conf's external-ip
; and MauiProgram.cs's CurrentLanHostAddress by docker/update-network-ip.ps1 — see that script.
; ringly:lan-ip
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0
external_media_address = 10.205.226.49
external_signaling_address = 10.205.226.49
local_net = 172.22.0.0/16

; All other transport parameters are ignored for wss/ws transports — (D)TLS itself
; is handled by http.conf, since both ride on Asterisk's built-in HTTP server.
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0

; Plain (unencrypted) WebSocket, riding on http.conf's plain 8088 listener — same
; "internal-only, dev convenience" precedent as ARI running unencrypted on 8088
; per §6 checklist item 7. Real finding from testing samples/Ringly.Samples.Maui
; against an Android emulator: platform TLS stacks (Android's, confirmed; likely
; others) reject transport-wss's self-signed dev cert outright
; (SSLHandshakeException/CertificateException) — trusting a self-signed cert
; per-client-platform is real friction for a local getting-started sample, so
; this exists as the low-friction default for local dev; use transport-wss (with
; a properly trusted certificate) for anything beyond that.
[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0
