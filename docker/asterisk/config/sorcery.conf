;
; §6 item 8 — PJSIP endpoint/auth/aor objects sourced from realtime (Postgres).
; A dual static+realtime chain (config,pjsip.conf + realtime,...) is NOT valid
; syntax here — Asterisk rejects it with "Unsupported option 'realtime' used
; for configuration file 'pjsip.conf'" even as repeated key lines. Matches
; the exact form in Asterisk's own sorcery.conf.sample.
;
[res_pjsip]
endpoint = realtime,ps_endpoints
auth = realtime,ps_auths
aor = realtime,ps_aors
domain_alias = realtime,ps_domain_aliases
contact = realtime,ps_contacts

[res_pjsip_endpoint_identifier_ip]
identify = realtime,ps_endpoint_id_ips
